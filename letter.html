<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>母親節專屬信件</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        /* ===== 基礎配置 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes pageFadeIn { from { opacity: 0; } to { opacity: 1; } }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center; /* 水平置中 */
            align-items: center;     /* 垂直置中 */
            font-family: 'Noto Sans TC', sans-serif;
            position: relative;
            animation: pageFadeIn 0.8s ease forwards;
            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,.9), transparent 40%),
                radial-gradient(circle at 80% 30%, rgba(255,182,193,.35), transparent 45%),
                radial-gradient(circle at 40% 80%, rgba(173,216,230,.35), transparent 50%),
                linear-gradient(135deg, #ffe4ec, #fff7fa, #e6f3ff);
        }

        /* ===== 動態背景特效 ===== */
        body::before {
            content: "";
            position: absolute;
            inset: -200px;
            background: conic-gradient(from 0deg, rgba(255,182,193,.25), rgba(255,255,255,.2), rgba(173,216,230,.2), rgba(255,182,193,.25));
            filter: blur(90px);
            animation: spin 18s linear infinite;
            z-index: 0;
        }

        /* ===== 返回鍵 ===== */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(255,255,255,.5);
            backdrop-filter: blur(10px);
            color: #333333;
            font-size: 15px;
            font-weight: 700;
            border: 1px solid rgba(0,0,0,.1);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: .3s ease;
            z-index: 999;
        }

        /* ===== 信件容器核心 (關鍵改動) ===== */
        .container {
            position: relative;
            width: 520px;
            display: flex;
            justify-content: center;
            align-items: center; /* 讓內容由中心發散 */
            z-index: 5;
        }

        .letter {
            position: absolute;
            width: 460px;
            height: 200px; /* 初始縮在信封內的高度 */
            background: rgba(255,255,255,0.98);
            border-radius: 28px;
            padding: 40px 15px 40px 40px; 
            line-height: 2.2;
            color: #555;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: 1s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            z-index: 1;
            opacity: 0; /* 沒打開前先隱藏，避免穿幫 */
        }

        /* 內容滾動區 */
        .content {
            height: 100%;
            overflow-y: auto;
            padding-right: 20px;
        }

        .content::-webkit-scrollbar { width: 5px; }
        .content::-webkit-scrollbar-thumb { background: #f3c7cf; border-radius: 10px; }

        .letter::before {
            content: "";
            position: absolute;
            inset: 18px;
            border: 2px dashed #f3c7cf;
            border-radius: 22px;
            pointer-events: none;
            z-index: 2;
        }

        .content h2 { color: #d96c87; margin-bottom: 15px; }

        .content p {
            font-size: 18px;
            margin-bottom: 15px;
            opacity: 0;
            transform: translateY(20px);
            transition: .6s;
        }

        /* ===== 信封樣式 ===== */
        .envelope {
            position: relative;
            width: 520px;
            height: 300px;
            cursor: pointer;
            transition: 0.8s ease;
            z-index: 10;
        }

        .envelope-back {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, #ffd8df, #ffc5d0);
            border-radius: 26px;
            box-shadow: 0 15px 40px rgba(217, 108, 135, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ===== 打開後的狀態改動 ===== */
        .open .envelope {
            transform: translateY(180px); /* 信封往下掉 */
            opacity: 0;
            pointer-events: none;
        }

        .open .letter {
            opacity: 1;
            /* 讓信紙相對於中心展開 */
            transform: translateY(-20px) scale(1.05); 
            height: 80vh; 
            max-height: 600px;
            z-index: 11;
        }

        .open .content p {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 0.3s;
        }

        /* ===== 裝飾 ===== */
        .heart { position: absolute; color: #ff4f86; font-size: 30px; animation: float 3s infinite; }
        .h1 { top: -40px; left: 0px; }
        .h2 { top: -80px; right: 0px; }

        .tip {
            position: absolute;
            bottom: -60px;
            width: 100%;
            text-align: center;
            color: #d96c87;
            font-weight: 500;
            animation: float 2s infinite;
        }

        .petals span {
            position: absolute;
            top: -10%;
            width: 12px;
            height: 12px;
            background: rgba(255,182,193,.8);
            border-radius: 50% 50% 50% 0;
            animation: fall 10s linear infinite;
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes fall { 0% { transform: translateY(-10%) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(110vh) rotate(360deg); opacity: 0; } }

        /* 手機版適應：確保寬度不爆出去 */
        @media (max-width: 550px) {
            .container, .envelope { width: 90vw; }
            .letter { width: 85vw; padding: 30px 10px 30px 20px; }
        }
    </style>
</head>

<body>
    <div class="back-btn" onclick="goBack()">← 返回</div>
    <div class="petals" id="petal-container"></div>

    <div class="container">
        <!-- 裝飾心形 -->
        <div class="heart h1">❤</div>
        <div class="heart h2">❤</div>

        <!-- 信紙部分 -->
        <div class="letter">
            <div class="content">
                <h2>To <span id="title-role">Mom</span></h2>
                <p>親愛的<span id="target"></span>：</p>
                <p>這是一個特別為您製作的小驚喜。</p>
                <p>謝謝您在過去的日子裡，總是給予我最溫暖的支持與照顧。無論我遇到什麼困難，只要想到家，心裡就充滿了力量。</p>
                <p>雖然平常我可能不常把感謝掛在嘴邊，但在這個屬於您的日子，我真的很想對您說：您辛苦了！</p>
                <p>願這份小小的禮物能帶給您好心情，也希望您在未來的每一天，都能像今天一樣笑得燦爛，身體健康，事事順心。</p>
                <p>我們一起創造了許多美好的回憶，未來我也會一直陪伴在您身邊，讓我們繼續幸福下去吧！</p>
                <p>再次祝您 母親節快樂，我愛您！❤</p>
                <p style="text-align: right; margin-top: 30px;">您的孩子 敬上</p>
            </div>
        </div>

        <!-- 信封部分 -->
        <div class="envelope" onclick="openLetter()">
            <div class="envelope-back">
                <span style="color: white; font-size: 60px;">✉</span>
            </div>
            <div class="tip">點一下信封開啟這份心意 ✨</div>
        </div>
    </div>

    <script>
        // 初始化設定
        const role = localStorage.getItem('userRole') || 'mom';
        document.getElementById('target').innerText = (role === 'mom') ? '媽媽' : '外婆';
        document.getElementById('title-role').innerText = (role === 'mom') ? 'Mom' : 'Grandma';

        // 花瓣產生器
        const petalContainer = document.getElementById('petal-container');
        for (let i = 0; i < 8; i++) {
            const span = document.createElement('span');
            span.style.left = (Math.random() * 100) + '%';
            span.style.animationDelay = (Math.random() * 5) + 's';
            span.style.animationDuration = (Math.random() * 5 + 5) + 's';
            petalContainer.appendChild(span);
        }

        function openLetter() {
            document.querySelector('.container').classList.add('open');
        }

        function goBack() {
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.href = 'main.html';
            }, 300);
        }
    </script>
</body>
</html>
