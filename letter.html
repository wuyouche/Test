<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>母親節專屬信件</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        /* ===== 基礎與防閃爍動畫 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes pageFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Sans TC', sans-serif;
            position: relative;
            animation: pageFadeIn 0.8s ease forwards;
            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,.9), transparent 40%),
                radial-gradient(circle at 80% 30%, rgba(255,182,193,.35), transparent 45%),
                radial-gradient(circle at 40% 80%, rgba(173,216,230,.35), transparent 50%),
                linear-gradient(135deg, #ffe4ec, #fff7fa, #e6f3ff);
        }

        /* ===== 動態背景效果 ===== */
        body::before {
            content: "";
            position: absolute;
            inset: -200px;
            background: conic-gradient(
                from 0deg,
                rgba(255,182,193,.25),
                rgba(255,255,255,.2),
                rgba(173,216,230,.2),
                rgba(255,182,193,.25)
            );
            filter: blur(90px);
            animation: spin 18s linear infinite;
            z-index: 0;
        }

        /* ===== 返回鍵 ===== */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(255,255,255,.5);
            backdrop-filter: blur(10px);
            color: #333333;
            font-size: 15px;
            font-weight: 700;
            border: 1px solid rgba(0,0,0,.1);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: .3s ease;
            z-index: 999;
        }

        .back-btn:hover {
            transform: scale(1.08);
            background: rgba(255,255,255,.8);
            box-shadow: 0 0 20px rgba(255,182,193,.6);
        }

        /* ===== 花瓣與裝飾 ===== */
        .petals span {
            position: absolute;
            top: -10%;
            width: 12px;
            height: 12px;
            background: rgba(255,182,193,.8);
            border-radius: 50% 50% 50% 0;
            animation: fall 10s linear infinite;
            opacity: .7;
            z-index: 1;
        }
        
        @keyframes fall {
            0% { transform: translateY(-10%) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* ===== 信件容器核心 ===== */
        .container {
            position: relative;
            width: 520px;
            height: 560px;
            z-index: 5;
            transition: 0.5s;
        }

        .letter {
            position: absolute;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            width: 460px;
            height: 400px; /* 初始高度 */
            background: rgba(255,255,255,0.98);
            border-radius: 28px;
            padding: 40px 15px 40px 40px; 
            line-height: 2.2;
            color: #555;
            box-shadow: 0 30px 80px rgba(0,0,0,0.18);
            transition: 1s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        /* 內容滾動區 */
        .content {
            height: 100%;
            overflow-y: auto;
            padding-right: 25px;
            scrollbar-width: thin;
            scrollbar-color: #f3c7cf transparent;
        }

        /* 捲軸樣式 */
        .content::-webkit-scrollbar { width: 6px; }
        .content::-webkit-scrollbar-thumb { background: #f3c7cf; border-radius: 10px; }

        .letter::before {
            content: "";
            position: absolute;
            inset: 18px;
            border: 2px dashed #f3c7cf;
            border-radius: 22px;
            pointer-events: none;
            z-index: 2;
        }

        .content h2 {
            font-size: 32px;
            color: #d96c87;
            margin-bottom: 20px;
        }

        .content p {
            font-size: 18px;
            margin-bottom: 15px;
            opacity: 0;
            transform: translateY(15px);
            transition: .7s;
        }

        /* ===== 信封樣式 ===== */
        .envelope {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 250px;
            cursor: pointer;
            transition: 0.8s ease;
            z-index: 10;
        }

        .envelope-back {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, #ffd8df, #ffc5d0);
            border-radius: 26px;
            box-shadow: 0 15px 40px rgba(217, 108, 135, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 點選後的動畫狀態 */
        .open .envelope {
            opacity: 0;
            transform: translateY(100px);
            pointer-events: none;
        }

        .open .letter {
            bottom: 120px;
            height: 75vh;
            max-height: 550px;
            transform: translateX(-50%) scale(1.05);
        }

        .open .content p {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== 裝飾動畫 ===== */
        .heart {
            position: absolute;
            color: #ff4f86;
            font-size: 30px;
            animation: float 3s ease-in-out infinite;
        }
        .h1 { top: -30px; left: -20px; }
        .h2 { top: -70px; right: -20px; }

        .tip {
            position: absolute;
            bottom: -60px;
            width: 100%;
            text-align: center;
            color: #d96c87;
            font-weight: 500;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* 手機版適應 */
        @media (max-width: 500px) {
            .container { width: 90%; }
            .letter { width: 95%; padding: 30px 10px 30px 25px; }
            .open .letter { height: 80vh; }
        }
    </style>
</head>

<body>
    <div class="back-btn" onclick="goBack()">← 返回</div>

    <div class="petals" id="petal-container"></div>

    <div class="container">
        <div class="heart h1">❤</div>
        <div class="heart h2">❤</div>

        <div class="letter">
            <div class="content">
                <h2>To <span id="title-role">Mom</span></h2>
                <p>親愛的<span id="target"></span>：</p>
                
                <!-- 信件內容區，隨便寫多長都行 -->
                <p>這是一個特別為您製作的小驚喜。</p>
                <p>謝謝您在過去的日子裡，總是給予我最溫暖的支持與照顧。無論我遇到什麼困難，只要想到家，心裡就充滿了力量。</p>
                <p>雖然平常我可能不常把感謝掛在嘴邊，但在這個屬於您的日子，我真的很想對您說：您辛苦了！</p>
                <p>願這份小小的禮物能帶給您好心情，也希望您在未來的每一天，都能像今天一樣笑得燦爛，身體健康，事事順心。</p>
                <p>我們一起創造了許多美好的回憶，未來我也會一直陪伴在您身邊，讓我們繼續幸福下去吧！</p>
                <p>再次祝您 母親節快樂，我愛您！❤</p>
                
                <p style="text-align: right; margin-top: 30px;">您的孩子 敬上</p>
            </div>
        </div>

        <div class="envelope" onclick="openLetter()">
            <div class="envelope-back">
                <span style="color: white; font-size: 50px;">✉</span>
            </div>
        </div>
        <div class="tip">點一下信封開啟這份心意 ✨</div>
    </div>

    <script>
        // 1. 初始化角色資訊
        const role = localStorage.getItem('userRole') || 'mom';
        document.getElementById('target').innerText = (role === 'mom') ? '媽媽' : '外婆';
        document.getElementById('title-role').innerText = (role === 'mom') ? 'Mom' : 'Grandma';

        // 2. 自動產生飄落花瓣
        const petalContainer = document.getElementById('petal-container');
        for (let i = 0; i < 6; i++) {
            const span = document.createElement('span');
            span.style.left = (Math.random() * 100) + '%';
            span.style.animationDelay = (Math.random() * 5) + 's';
            span.style.animationDuration = (Math.random() * 5 + 5) + 's';
            petalContainer.appendChild(span);
        }

        // 3. 開啟信件
        function openLetter() {
            document.querySelector('.container').classList.add('open');
            document.querySelector('.tip').style.display = 'none';
        }

        // 4. 返回邏輯
        function goBack() {
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.href = 'main.html'; // 或 window.history.back();
            }, 300);
        }
    </script>
</body>
</html>
