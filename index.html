<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>母親節專屬驚喜</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ===== 基礎設定與進場動畫 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Sans TC', sans-serif;
            animation: pageFadeIn 1s ease-out forwards;
            
            /* 與主頁一致的夢幻背景 */
            background: 
                radial-gradient(circle at 20% 20%, rgba(255,255,255,.9), transparent 40%),
                radial-gradient(circle at 80% 30%, rgba(255,182,193,.35), transparent 45%),
                radial-gradient(circle at 40% 80%, rgba(173,216,230,.35), transparent 50%),
                linear-gradient(135deg, #ffe4ec, #fff7fa, #e6f3ff);
        }

        /* ===== 背景流動光影 ===== */
        body::before {
            content: "";
            position: absolute;
            inset: -200px;
            background: conic-gradient(
                from 0deg,
                rgba(255,182,193,0.3),
                rgba(255,255,255,0.2),
                rgba(173,216,230,0.2),
                rgba(255,182,193,0.3)
            );
            filter: blur(90px);
            animation: spin 20s linear infinite;
            z-index: 0;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ===== 登入容器 ===== */
        .login-container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #555; /* 使用深灰色，質感更好 */
            font-size: 28px;
            margin-bottom: 40px;
            letter-spacing: 2px;
            font-weight: 500;
        }

        /* ===== 華麗按鈕組 ===== */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .btn {
            position: relative;
            padding: 18px 60px;
            font-size: 20px;
            font-weight: 500;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            background: white;
            color: #333; /* 按鈕文字黑色/深灰 */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* 按鈕內的動態漸層 */
        .btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 182, 193, 0.4),
                transparent
            );
            transition: 0.5s;
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(255, 182, 193, 0.4);
            color: #d96c87; /* 懸停時變色 */
        }

        .btn:hover::before {
            left: 100%;
        }

        /* 外婆按鈕專屬色（玫瑰粉） */
        .btn-grandma:hover {
            border-color: #ffb6c1;
        }

        /* 媽媽按鈕專屬色（酷洛米紫/灰） */
        .btn-mom:hover {
            border-color: #b19cd9;
        }

        /* 離場動畫層 */
        .transition-overlay {
            position: fixed;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            transition: 0.6s ease;
        }

        .transition-overlay.active {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="transition-overlay" id="overlay"></div>

    <div class="login-container">
        <h1>請選擇您的身份</h1>
        <div class="btn-group">
            <button onclick="selectUser('grandma')" class="btn btn-grandma">我是外婆 🌹</button>
            <button onclick="selectUser('mom')" class="btn btn-mom">我是媽媽 🖤</button>
        </div>
    </div>

    <script>
        function selectUser(user) {
            const overlay = document.getElementById('overlay');
            localStorage.setItem('userRole', user);
            
            // 觸發離場視覺效果
            overlay.classList.add('active');
            document.querySelector('.login-container').style.transform = 'scale(0.9)';
            document.querySelector('.login-container').style.opacity = '0';
            document.querySelector('.login-container').style.transition = '0.6s';

            // 延遲跳轉確保動畫跑完
            setTimeout(() => {
                window.location.href = 'splash.html';
            }, 600);
        }
    </script>
</body>
</html>
