<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>母親節快樂 - 首頁</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
/* ======================
    🌌 基礎與防閃爍動畫
====================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

@keyframes pageFadeIn {
    from { opacity: 0; transform: scale(1.02); }
    to { opacity: 1; transform: scale(1); }
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Noto Sans TC', sans-serif;
    /* 防止換頁瞬間閃爍 */
    animation: pageFadeIn 0.8s ease-out forwards;

    background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.9), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(255,182,193,.35), transparent 45%),
    radial-gradient(circle at 50% 80%, rgba(173,216,230,.35), transparent 50%),
    linear-gradient(135deg, #ffe4ec, #fff7fb, #e6f3ff);
}

/* 🌈 流動光層 */
body::before {
    content: "";
    position: absolute;
    inset: -200px;
    background: conic-gradient(
        from 0deg,
        rgba(255,182,193,.3),
        rgba(255,255,255,.2),
        rgba(173,216,230,.2),
        rgba(255,182,193,.3)
    );
    filter: blur(90px);
    animation: spin 18s linear infinite;
    z-index: 0;
}

/* ======================
    📦 主選單
====================== */
.main-menu {
    display: flex;
    gap: 40px;
    z-index: 2;
}

/* ======================
    💎 卡片樣式
====================== */
.card {
    width: 220px;
    height: 240px;
    background: rgba(255,255,255,0.3);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 32px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    border: 1px solid rgba(255,255,255,0.4);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.card:hover {
    transform: translateY(-15px) scale(1.05);
    background: rgba(255,255,255,0.5);
    box-shadow: 0 30px 60px rgba(255,182,193,0.4);
}

/* ✨ 光影掃過效果 */
.card::after {
    content: "";
    position: absolute;
    top: 0;
    left: -150%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: skewX(-20deg);
    transition: 0.6s;
}

.card:hover::after {
    left: 150%;
}

.icon {
    font-size: 56px;
    margin-bottom: 15px;
    filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
}

h2 {
    font-size: 20px;
    color: #444;
    font-weight: 500;
    letter-spacing: 1px;
}

/* ======================
    🚪 轉場遮罩
====================== */
.page-transition {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #ffb6c1, #cfe8ff);
    opacity: 0;
    pointer-events: none;
    z-index: 9999;
    transition: opacity 0.5s ease-in-out;
}

.page-transition.active {
    opacity: 1;
    pointer-events: all;
}

/* ======================
    🔁 動畫定義
====================== */
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* 手機版優化 */
@media (max-width: 600px) {
    .main-menu {
        flex-direction: column;
        gap: 20px;
    }
    .card {
        width: 180px;
        height: 180px;
    }
}
</style>
</head>

<body>

<!-- 轉場層 -->
<div class="page-transition" id="transition"></div>

<!-- 主選單內容 -->
<div class="main-menu">

    <!-- 前往書信 -->
    <div class="card" onclick="goPage('letter.html')">
        <div class="icon">✉️</div>
        <h2>打開書信</h2>
    </div>

    <!-- 前往影片 -->
    <div class="card" onclick="goPage('video.html')">
        <div class="icon">🎬</div>
        <h2>觀看影片</h2>
    </div>

</div>

<script>
// 頁面跳轉邏輯
function goPage(url) {
    const transitionLayer = document.getElementById('transition');
    
    // 1. 啟動轉場遮罩（漸黑/漸色）
    transitionLayer.classList.add('active');
    
    // 2. 讓原本的內容縮小淡出
    document.querySelector('.main-menu').style.opacity = '0';
    document.querySelector('.main-menu').style.transform = 'scale(0.9)';
    document.querySelector('.main-menu').style.transition = '0.5s ease';

    // 3. 延遲跳頁，等待動畫完成
    setTimeout(() => {
        window.location.href = url;
    }, 500);
}

// 處理瀏覽器「上一頁」跳回時的狀態恢復
window.onpageshow = function(event) {
    if (event.persisted) {
        document.getElementById('transition').classList.remove('active');
        document.querySelector('.main-menu').style.opacity = '1';
        document.querySelector('.main-menu').style.transform = 'scale(1)';
    }
};
</script>

</body>
</html>
